# Lint settings (used by `ruff check .` locally and in CI).
# Only syntax errors (E9) and real-bug checks from pyflakes (F) are enabled:
# unused or duplicated imports, undefined names, unused variables.
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data", "dbt/target"]

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# These two files import the same names twice (harmless, but ruff reports F811).
# Delete the duplicate import lines, then remove these two entries.
"src/pipeline/extract_asteroids.py" = ["F811"]
"src/pipeline/extract_asteroid_details.py" = ["F811"]
