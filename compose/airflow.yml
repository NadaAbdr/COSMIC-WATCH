services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PROJECT_DIR: /opt/airflow/project
      PIPELINE_CLI: /home/airflow/venv/bin/python -m pipeline.cli
      DBT_BIN: /home/airflow/venv/bin/dbt
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/project/data
      - ./dbt:/opt/airflow/project/dbt
      - airflow_db:/opt/airflow/db
    command: standalone
    restart: unless-stopped

volumes:
  airflow_db: