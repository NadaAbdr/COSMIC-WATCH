[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-watch"
version = "0.1.0"
description = "NASA NeoWs asteroid pipeline: extract, transform, validate, load"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dbt = ["dbt-postgres>=1.8"]

[project.scripts]
cosmic-watch = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]